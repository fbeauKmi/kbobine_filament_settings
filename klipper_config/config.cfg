## Persistent variables for KBobine
[vars]
filename: ~/printer_data/config/kbobine_persistent.cfg

## Variables for KBobine
[vars KBOBINE]

[kbobine]
apply_on_load: true         # True|False Apply setting on filament load/change
store_in_spoolman: true     # True|False Store settings in Spoolman db (see doc)
spool_file: ~/printer_data/config/kbobine.json
calibrate_gcode: CALIBRATE
parameters: 
  ## Default settings       [default, min, max]
    bed_temp              : [ 100,  50, 125],
    extruder_temp         : [ 250, 190, 270],
    chamber_temp          : [  50,   0,  80],
    fan_speed             : [ 0.2,   0,   1],
    filter_speed          : [ 0.5, 0.5,   1],
    z_hop_height          : [ 0.1,   0, 0.5],
    soak_delay            : [  30,   0, 120],
    z_adjust              : [   0,  -1,   1],
    filament_sensor       : [   1,   0,   1],
    filament_dryer        : [   0,   0,   1],
    pressure_advance      : [0.04,   0,   5],
    pa_smooth_time        : [0.04,   0,   1],
    extrude_factor        : [0.93, 0.8, 1.5],
    max_flow              : [  20,  10,  30],
    retract_length        : [ 0.5,   0,   5],
    retract_speed         : [  40,  10,  50],
    unretract_extra_length: [   0,   0,  10],
    unretract_speed       : [  40,  10,  50],
    shrinkage_xy          : [   1, 0.9, 1.0],
    shrinkage_z           : [   1, 0.9, 1.0],
    purge_length          : [  0,   0, 100]

# settings required, if not present in filaments settings table, UI will prompt user for calibration
required_params:
    extrude_factor,
    pressure_advance

# settings depend on Toolhead, will be store against nozzle diameter [NEED TO IMPROVE]
th_depend:
    extrude_factor,
    pressure_advance,
    pa_smooth_time,
    max_flow,
    retract_length,
    retract_speed,
    unretract_extra_length,
    unretract_speed


#[include ./addons/calibrate.cfg]  # DO NOT REMOVE

## Below addons requires tuned Slicer output
[include ./addons/fan_speed.cfg] # Requires a tuned slicer output

